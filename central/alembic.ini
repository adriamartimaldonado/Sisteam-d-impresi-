# Configuracion de Alembic. La URL de la BD la pone env.py desde el entorno
# (.env / DATABASE_URL), nunca se escribe aqui (§15: ningun secreto en el repo).
#
# Uso (desde la carpeta central/):
#   alembic upgrade head        # aplica migraciones
#   alembic downgrade -1        # (solo desarrollo)

[alembic]
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
